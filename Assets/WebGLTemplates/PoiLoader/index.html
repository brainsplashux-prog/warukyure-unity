    // WebGL メインループ内から poiFxJackpot が呼ばれた際に

        getComputedStyle(root).opacity;
        getComputedStyle(root).visibility;

      function rafLoop(){
        if (!window.__poiFxActive) return;
        flush();
        requestAnimationFrame(rafLoop);

        if (window.__poiFxActive) { _orig(opts); return; }

    <script>(function () {
      function isDemoUrl(url) {
        if (!url) return false;
        var hashIdx = url.indexOf('#');
        if (hashIdx >= 0) url = url.substring(0, hashIdx);
        var qIdx = url.indexOf('?');
        if (qIdx < 0) return false;
        var query = url.substring(qIdx + 1);
        var pairs = query.split('&');
        for (var i = 0; i < pairs.length; i++) {
          var pair = pairs[i];
          var eq = pair.indexOf('=');
          if (eq < 0) continue;
          var key = pair.substring(0, eq);

                // pages automatically. This functionality is only needed if you want to switch between loading
                // multiple Unity builds on a single web page.
                var quit = document.createElement("button");
                quit.style = "margin-left: 5px; background-color: lightgray; border: none; padding: 5px; cursor: pointer";
                quit.innerHTML = "Unload";
                document.querySelector("#unity-build-title").appendChild(quit);
                quit.onclick = () => {
                  // Quit Unity application execution
                  unityInstance.Quit().then(() => {
                    unityProfiler.shutDown();
                    // Remove DOM elements from the page so GC can run
                    document.querySelector("#unity-container").remove();
                    canvas = null;
                    // Remover script elements from the page so GC can run
                    script.remove();
                    script = null;
                  });
                };
#endif
              }).catch((message) => {
                if (window.poiLoadingAbort) window.poiLoadingAbort();
                alert(message);
              });
            } catch (e) {
              if (window.poiLoadingAbort) window.poiLoadingAbort();
            }
          };

      document.body.appendChild(script);

    </script>
  </body>
</html>
